name: Refresh market values

on:
  push:
    branches: [main]
    paths:
      - 'data/companies.json'
      - 'scripts/fetch-marketcaps.mjs'
      - '.github/workflows/marketcaps.yml'
  schedule:
    # Weekdays after the US close. GitHub's scheduler is best-effort and drops
    # runs under load, so the page always reads the date out of the file rather
    # than assuming it is current.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketcaps
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch market values
        run: node scripts/fetch-marketcaps.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/marketcaps.json; then
            echo "no change"
            exit 0
          fi
          git add data/marketcaps.json
          git commit -m "Refresh market values"
          git push
